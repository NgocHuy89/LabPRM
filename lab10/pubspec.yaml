name: lab10_full
description: Lab 10 - Authentication, Session Management & Notifications (Full Integration)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # Session persistence
  shared_preferences: ^2.2.2

  # Firebase Auth + Google Sign-In
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.6
  google_sign_in: ^6.2.1

  # Local notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
